[package]
name = "familiar-mascot"
version = "0.2.6"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-global-shortcut = "2"
serde_json = "1"
libc = "0.2"
tauri-plugin-updater = "2"
# The same TLS stack the updater builds, plus multipart for speech-to-text uploads.
reqwest = { version = "0.13", default-features = false, features = ["json", "multipart", "rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring"] }
# Live transcription over the Realtime API's WebSocket, with the same TLS and the system's trust store.
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect", "__rustls-tls"] }
rustls-platform-verifier = "0.7"
tokio = { version = "1", features = ["macros", "sync", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-foundation = { version = "0.3", features = ["NSArray", "NSGeometry", "NSNotification", "NSOperation", "NSString", "block2"] }
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSEvent", "NSResponder", "NSScreen", "NSWindow"] }
