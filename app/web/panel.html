<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>familiar</title>
<link rel="stylesheet" href="sheet.css">
<style>
#b{height:100%}
main{display:flex;flex-direction:column;gap:12px;flex:1 1 0}
#shelf{flex:none;max-height:38%;overflow-y:auto;display:grid;gap:6px;padding:8px 18px;border-top:1.5px dashed var(--edge);background:var(--tint);scrollbar-width:thin}
#shelf[hidden]{display:none}
#shelf.reading{max-height:70%}
#shelf-title{font-size:12px;font-weight:600;color:var(--sub)}
#shelf article{background:var(--paper)}
#shelf article.compact .meta{display:none}
.card-top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card-top .meta{white-space:nowrap}
.topic{display:flex;flex-direction:column;gap:6px;background:var(--tint);border-radius:10px;padding:6px 10px}
.topic h3{color:var(--accent)}
.topic .you{background:var(--paper)}
.quiet{font-size:12px;color:var(--sub)}
.said-list{display:grid;gap:4px;margin-top:3px}
details.talked{font-size:12px;color:var(--sub)}
details.talked summary{cursor:pointer}
.line{white-space:pre-wrap;line-height:1.75;max-width:92%;line-break:strict;overflow-wrap:anywhere;user-select:text;-webkit-user-select:text}
.line:has(> .md){white-space:normal;max-width:100%}
.you{align-self:flex-end;background:var(--tint);border-radius:12px;padding:6px 12px;margin:4px 0}
/* 段落の間は行間より広く、見出しは前の段落から離して次の内容に寄せる */
.md{display:grid;gap:9px;line-height:1.75;line-break:strict;overflow-wrap:anywhere;min-width:0;user-select:text;-webkit-user-select:text}
.md p{margin:0}
.md h4{margin:7px 0 -5px;font-size:13.5px;font-weight:700;line-height:1.5}
.md h4:first-child{margin-top:0}
.md ul{margin:0;padding:0;list-style:none;display:grid;gap:3px}
.md li{display:flex;gap:6px}
.md-mark{flex:none;min-width:1.05em;color:var(--sub);font-variant-numeric:tabular-nums}
.md-item{min-width:0}
.md strong{font-weight:700}
.md em{font-style:normal;color:var(--accent)}
.md code{font:12px/1.5 ui-monospace,Menlo,monospace;background:var(--tint);border-radius:4px;padding:1px 4px}
.md pre{margin:0;overflow-x:auto;white-space:pre}
.md blockquote{display:grid;gap:6px;color:var(--sub);padding-left:10px;border-left:2px solid var(--edge)}
.md hr{width:100%;border:0;border-top:1px solid var(--edge);margin:3px 0}
.md-link{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline;overflow-wrap:anywhere}
.md-link:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.md-table{overflow-x:auto}
.md table{border-collapse:collapse;font-size:12.5px;line-height:1.55}
.md th,.md td{border:1px solid var(--edge);padding:3px 8px;text-align:left;vertical-align:top}
.md th{background:var(--tint);font-weight:600}
.topic .md code,.topic .md th{background:var(--paper)}
#shelf .md{gap:7px;font-size:13px;line-height:1.7}
.said-list b{display:block;margin-top:4px}
.wait{color:var(--sub)}
.error{color:var(--warn);white-space:pre-wrap}
details.scan{font-size:12px;color:var(--sub);user-select:text;-webkit-user-select:text}
details.scan summary{cursor:pointer}
details.entry{margin:3px 0 0 12px}
pre{margin:3px 0 0;padding:6px 8px;border-radius:8px;background:var(--tint);color:var(--ink);white-space:pre-wrap;word-break:break-word;font:11.5px/1.5 ui-monospace,Menlo,monospace}
.said{margin:3px 0 0 12px;color:var(--ink)}
#cards{display:flex;flex-direction:column;gap:8px}
#cards:empty{display:none}
article{border:1.5px solid var(--edge);border-radius:12px;padding:9px 12px;display:grid;gap:5px}
article.selected{border-color:var(--accent)}
h2{margin:0;font-size:14px;line-height:1.45}
.meta{color:var(--sub);font-size:12px}
.high{color:var(--warn);font-weight:600}
p{margin:0}
.src{display:grid;gap:3px;font-size:12px;color:var(--sub)}
.link{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}
blockquote{margin:0;padding-left:8px;border-left:2px solid var(--edge)}
.details{font-size:13px;white-space:pre-wrap}
.question{color:var(--accent)}
.plan{font-size:13px;border-top:1px solid var(--edge);padding-top:6px}
.diff{font:11.5px/1.5 ui-monospace,Menlo,monospace;white-space:pre-wrap;word-break:break-word}
.add{background:#e6efdf}
.del{background:#f6e3dd;text-decoration:line-through}
.same{color:var(--sub)}
h3{margin:0;font-size:12px}
.actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:2px}
.actions button,form button,.chip button{font:inherit;font-size:12.5px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);border-radius:999px;padding:3px 13px;cursor:pointer}
.actions .go,#send{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
.actions .link{all:unset;cursor:pointer;margin-left:auto;font-size:12px;color:var(--accent);text-decoration:underline}
.actions .talk{margin-left:auto;color:var(--sub)}
.actions .link + .talk{margin-left:6px}
.note{font-size:12px;color:var(--warn);white-space:pre-wrap}
button:disabled{opacity:.5;cursor:default}
footer{flex:none;padding:8px 18px 12px;display:grid;gap:5px;border-top:1.5px dashed var(--edge)}
#chip{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--sub)}
#chip[hidden]{display:none}
#chip span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#chip .icon{width:18px;height:18px;line-height:18px;flex:none}
form{display:flex;gap:6px;align-items:center}
/* マイク。聞いている間は、声の大きさ（--level: 0〜1）に合わせて輪が広がり、少しふくらむ */
#mic{--level:0;flex:none;width:28px;height:28px;padding:0;display:grid;place-items:center;transition:box-shadow 90ms linear,transform 90ms linear}
#mic svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
#mic[hidden]{display:none}
#mic.on{background:var(--warn);border-color:var(--warn);color:var(--paper);box-shadow:0 0 0 calc(2px + var(--level) * 7px) color-mix(in srgb,var(--warn) 28%,transparent);transform:scale(calc(1 + var(--level) * .12))}
#mic.wait svg{animation:mic-wait 1s ease-in-out infinite}
@keyframes mic-wait{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#mic,#mic.wait svg{transition:none;animation:none}#mic.on{transform:none}}
/* 入れ替えを待っている新しい版。見逃さないよう、開いたときにいちばん上で伝える */
#update{flex:none;display:flex;gap:8px;align-items:center;justify-content:space-between;margin:0 18px 8px;padding:6px 8px 6px 12px;border-radius:10px;background:var(--tint);font-size:12.5px}
#update[hidden]{display:none}
#update button{font:inherit;font-size:12px;font-weight:600;border:1.5px solid var(--accent);background:var(--accent);color:var(--paper);border-radius:999px;padding:2px 11px;cursor:pointer;white-space:nowrap}
input{font:inherit;color:var(--ink);background:var(--tint);border:0;border-radius:8px;padding:6px 9px;flex:1;min-width:0}
/* 会話は読みもの。字を大きく、行間と段落の間を広く取り、1 行を 40 字ほどに収める。判断待ちのカードは一覧なので詰めたまま */
main{padding-top:6px}
#thread{display:flex;flex-direction:column;gap:26px;width:100%;max-width:40em;margin:0 auto;font-size:15px;letter-spacing:.03em;padding-bottom:8px}
#thread .line{line-height:1.9;max-width:100%}
#thread .md{gap:.95em;line-height:1.9}
#thread .md h4{margin:.8em 0 -.35em;font-size:15.5px;letter-spacing:.02em}
#thread .md h4:first-child{margin-top:0}
#thread .md ul{gap:.4em}
#thread .md li{gap:.45em}
#thread .md code{font-size:12.5px;letter-spacing:0;padding:1px 5px}
#thread .md table{font-size:13px;letter-spacing:0}
#thread .md blockquote{padding-left:14px}
#thread .you{max-width:85%;font-size:14.5px;line-height:1.75;padding:9px 15px;border-radius:16px;margin:0}
#thread .topic{gap:14px;padding:12px 16px;border-radius:14px}
#thread .topic h3{font-size:12.5px}
/* 見回りの記録は本文の邪魔をしない。続けて並ぶときは詰める */
#thread details.scan,#thread .quiet{font-size:12px;letter-spacing:0;line-height:1.6;color:var(--sub);opacity:.85}
#thread details.scan + details.scan{margin-top:-18px}
#thread details.talked{font-size:12.5px;letter-spacing:0}
</style></head>
<body><div id="b">
<header><span id="h">familiar</span><span><button id="settings" class="icon" aria-label="設定">⚙︎</button><button id="close" class="icon" aria-label="閉じる">×</button></span></header>
<div id="update" role="status" hidden><span id="update-text"></span><button id="update-now">今すぐ入れ替える</button></div>
<main id="m">
  <div id="thread" role="log"></div>
</main>
<section id="shelf" aria-label="判断待ち" hidden><div id="shelf-title"></div><div id="cards"></div></section>
<footer>
  <div id="chip" hidden><span id="chip-text"></span><button id="chip-clear" class="icon" aria-label="話題を外す">×</button></div>
  <form id="f"><input id="text" aria-label="話す" placeholder="話しかける" autocomplete="off"><button id="mic" type="button" aria-label="声で話す" title="声で話す" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg></button><button id="send">送る</button></form>
</footer>
<svg id="t" viewBox="0 0 15 15" aria-hidden="true"><path class="fill" d="M0 -1H1L15.25 14.25H0Z"/><path class="line" d="M1 0 15.25 14.25H0"/></svg>
</div><script src="markdown.js"></script><script src="speech.js"></script><script src="panel.js"></script></body></html>
