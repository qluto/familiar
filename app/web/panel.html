<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>提案</title>
<link rel="stylesheet" href="sheet.css">
<style>
h3{margin:12px 0 0;font-size:12px;color:var(--sub);font-weight:600}
.empty{color:var(--sub);padding:6px 0 10px}
.error{color:var(--warn);padding:6px 0 10px;white-space:pre-wrap}
article{padding:12px 0;display:grid;gap:6px;border-bottom:1.5px dashed var(--edge)}
article:last-child{border-bottom:0;padding-bottom:4px}
h2{margin:0;font-size:14.5px;line-height:1.45}
.meta{color:var(--sub);font-size:12px}
.high{color:var(--warn);font-weight:600}
p{margin:0}
.src{display:grid;gap:3px;font-size:12px;color:var(--sub)}
.src button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}
blockquote{margin:0;padding-left:8px;border-left:2px solid var(--edge)}
.details{font-size:13px;white-space:pre-wrap}
.question{font-weight:600;color:var(--accent);white-space:pre-wrap}
input{font:inherit;color:var(--ink);background:var(--tint);border:0;border-radius:8px;padding:5px 8px;width:100%}
.actions{display:flex;gap:6px;align-items:center;margin-top:2px}
.actions button{font:inherit;font-size:12.5px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);border-radius:999px;padding:3px 13px;cursor:pointer}
.actions .go{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--warn);white-space:pre-wrap}
</style></head>
<body><div id="b">
<header><span id="h"></span><span><button id="settings" class="icon" aria-label="設定">⚙︎</button><button id="close" class="icon" aria-label="閉じる">×</button></span></header>
<main id="m"></main>
<svg id="t" viewBox="0 0 15 15" aria-hidden="true"><path class="fill" d="M0 -1H1L15.25 14.25H0Z"/><path class="line" d="M1 0 15.25 14.25H0"/></svg>
</div><script src="panel.js"></script></body></html>
