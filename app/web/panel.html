<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>提案</title>
<style>
/* 小さな吹き出し（bubble.html）と同じ紙・線・尾で描く */
:root{--ink:#3b3a36;--sub:#7b766b;--paper:#fffdf7;--edge:#d9d2c3;--tint:#f4efe3;--accent:#5c7f4f;--warn:#a8452e}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:transparent;overflow:hidden}
body{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 18px 0 0;
  color:var(--ink);font:13.5px/1.6 -apple-system,"Hiragino Sans",sans-serif}
#b{position:relative;width:100%;max-height:100vh;display:flex;flex-direction:column;background:var(--paper);
  border:1.5px solid var(--edge);border-radius:18px 18px 0 18px}
#t{position:absolute;left:calc(100% - 1px);bottom:-1.5px;width:15px;height:15px;overflow:visible}
#t .fill{fill:var(--paper)}
#t .line{fill:none;stroke:var(--edge);stroke-width:1.5;stroke-linejoin:miter;stroke-linecap:square}
header{flex:none;display:flex;align-items:center;justify-content:space-between;padding:12px 12px 6px 18px;font-weight:600;font-size:14px}
#close{all:unset;cursor:pointer;width:24px;height:24px;border-radius:12px;text-align:center;line-height:24px;color:var(--sub)}
#close:hover{background:var(--tint)}
main{flex:1 1 auto;min-height:0;overflow-y:auto;padding:0 18px 12px;scrollbar-width:thin}
h3{margin:12px 0 0;font-size:12px;color:var(--sub);font-weight:600}
.empty{color:var(--sub);padding:6px 0 10px}
.error{color:var(--warn);padding:6px 0 10px;white-space:pre-wrap}
article{padding:12px 0;display:grid;gap:6px;border-bottom:1.5px dashed var(--edge)}
article:last-child{border-bottom:0;padding-bottom:4px}
h2{margin:0;font-size:14.5px;line-height:1.45}
.meta{color:var(--sub);font-size:12px}
.high{color:var(--warn);font-weight:600}
p{margin:0}
.src{display:grid;gap:3px;font-size:12px;color:var(--sub)}
.src button{all:unset;cursor:pointer;color:var(--accent);text-decoration:underline}
blockquote{margin:0;padding-left:8px;border-left:2px solid var(--edge)}
details summary{cursor:pointer;color:var(--sub);font-size:12px}
.form{display:grid;gap:6px;margin-top:6px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
label{display:grid;gap:2px;font-size:11.5px;color:var(--sub)}
input,textarea{font:inherit;color:var(--ink);background:var(--tint);border:0;border-radius:8px;padding:5px 8px;width:100%}
textarea{resize:none;overflow:hidden;display:block;line-height:1.55}
.actions{display:flex;gap:6px;align-items:center;margin-top:2px}
.actions button{font:inherit;font-size:12.5px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);border-radius:999px;padding:3px 13px;cursor:pointer}
.actions .go{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.note{font-size:12px;color:var(--warn);white-space:pre-wrap}
</style></head>
<body><div id="b">
<header><span id="h"></span><button id="close" aria-label="閉じる">×</button></header>
<main id="m"></main>
<svg id="t" viewBox="0 0 15 15" aria-hidden="true"><path class="fill" d="M0 -1H1L15.25 14.25H0Z"/><path class="line" d="M1 0 15.25 14.25H0"/></svg>
</div><script src="panel.js"></script></body></html>
