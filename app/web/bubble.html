<!doctype html>
<html><head><meta charset="utf-8"><title>bubble</title>
<style>
:root{--ink:#3b3a36;--paper:#fffdf7;--edge:#d9d2c3}
html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none;-webkit-user-select:none}
body{display:flex;align-items:flex-end;justify-content:flex-end;padding:0 18px 0 0;box-sizing:border-box}
#b{position:relative;max-width:266px;white-space:pre-line;padding:9px 14px;border-radius:14px 14px 0 14px;background:var(--paper);border:1.5px solid var(--edge);
  color:var(--ink);font:600 14px/1.4 -apple-system,"Hiragino Sans",sans-serif;opacity:0;transition:opacity .18s}
#b.on{opacity:1}
/* 本体の右辺を塗りで隠し、下辺を先端まで水平に延ばす。斜辺は左上から右下へ 45 度 */
#t{position:absolute;left:calc(100% - 1px);bottom:-1.5px;width:15px;height:15px;overflow:visible}
#t .fill{fill:var(--paper)}
#t .line{fill:none;stroke:var(--edge);stroke-width:1.5;stroke-linejoin:miter;stroke-linecap:square}
</style></head>
<body><div id="b"><span id="s"></span><svg id="t" viewBox="0 0 15 15" aria-hidden="true"><path class="fill" d="M0 -1H1L15.25 14.25H0Z"/><path class="line" d="M1 0 15.25 14.25H0"/></svg></div>
<script>
const b = document.getElementById("b"), s = document.getElementById("s");
window.__TAURI__.event.listen("bubble-text", ({ payload }) => {
  s.textContent = payload;
  b.classList.add("on");
});
</script></body></html>
