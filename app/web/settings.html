<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>設定</title>
<link rel="stylesheet" href="sheet.css">
<style>
body{user-select:none;-webkit-user-select:none}
h3{margin:6px 0 8px;font-size:12px;color:var(--sub);font-weight:600}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px}
.name{font-size:14px;font-weight:600}
.keys{display:flex;gap:6px}
.keys button{font:inherit;font-size:12.5px;border:1.5px solid var(--edge);background:transparent;color:var(--ink);border-radius:999px;padding:3px 13px;cursor:pointer}
#record{min-width:132px;font-weight:600}
#record.on{background:var(--accent);border-color:var(--accent);color:var(--paper)}
.keys button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
#note{margin:8px 0 6px;font-size:12px;color:var(--sub)}
#note.error{color:var(--warn)}
.hint{margin:8px 0 6px;font-size:12px;color:var(--sub)}
.fields{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;align-items:center;margin-top:6px}
.fields label{font-size:12.5px;color:var(--sub)}
.fields input{font:inherit;font-size:13px;color:var(--ink);background:var(--tint);border:0;border-radius:8px;padding:5px 9px;min-width:0;user-select:text;-webkit-user-select:text}
.fields input:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.hint.error{color:var(--warn)}
.keys button:disabled{opacity:.5;cursor:default}
.fields select{font:inherit;font-size:13px;color:var(--ink);background:var(--tint);border:0;border-radius:8px;padding:4px 6px}
.fields select:focus-visible{outline:2px solid var(--accent);outline-offset:0}
.span{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--sub)}
#days button{padding:3px 8px;min-width:28px}
[hidden]{display:none!important}
.keys button.selected{background:var(--accent);border-color:var(--accent);color:var(--paper);font-weight:600}
</style></head>
<body><div id="b">
<header><span>設定</span><button id="close" class="icon" aria-label="閉じる">×</button></header>
<main id="m">
  <section aria-labelledby="h-call">
    <h3 id="h-call">呼びかけ</h3>
    <div class="row">
      <span class="name">ホットキー</span>
      <span class="keys"><button id="record"></button><button id="reset">元に戻す</button></span>
    </div>
    <p id="note" role="status"></p>
  </section>
  <section aria-labelledby="h-display">
    <h3 id="h-display">表示</h3>
    <div class="row">
      <span class="name">知らせ方</span>
      <span class="keys"><button id="character">キャラクター</button><button id="notch">ノッチ</button></span>
    </div>
    <p id="display-note" class="hint"></p>
  </section>
  <section aria-labelledby="h-scan">
    <h3 id="h-scan">見回り</h3>
    <div class="row"><span class="name">曜日</span><span class="keys" id="days" role="group" aria-label="見回る曜日"></span></div>
    <div class="row"><span class="name">見回り方</span><span class="keys"><button id="mode-times" type="button">時刻</button><button id="mode-interval" type="button">間隔</button></span></div>
    <form class="fields" id="scan" autocomplete="off">
      <label for="scan-times" data-mode="times">時刻</label><input id="scan-times" data-mode="times" placeholder="8:00, 13:00">
      <label for="scan-every" data-mode="interval">間隔</label><span class="span" data-mode="interval"><select id="scan-every"></select></span>
      <label for="scan-start" data-mode="interval">時間帯</label><span class="span" data-mode="interval"><select id="scan-start"></select>〜<select id="scan-end" aria-label="終わり"></select></span>
    </form>
    <div class="row"><span class="name">会議の前後</span><span class="keys"><button id="meet-on" type="button">見回る</button><button id="meet-off" type="button">見回らない</button></span></div>
    <p id="scan-note" class="hint" role="status"></p>
  </section>
  <section aria-labelledby="h-voice">
    <h3 id="h-voice">音声</h3>
    <p class="hint">OpenAI 互換のサーバを指定すると使えます。URL は /v1 まで書きます。空にすると使いません</p>
    <div class="row"><span class="name">音声認識</span><span class="keys"><button id="stt-file" type="button">一括</button><button id="stt-live" type="button">リアルタイム</button></span></div>
    <form class="fields" id="stt" autocomplete="off">
      <label for="stt-baseUrl">サーバ</label><input id="stt-baseUrl" name="baseUrl" placeholder="例: http://localhost:8000/v1">
      <label for="stt-apiKey">API キー</label><input id="stt-apiKey" name="apiKey" type="password" placeholder="なければ空のまま">
      <label for="stt-model">モデル</label><input id="stt-model" name="model" placeholder="whisper-1">
    </form>
    <p id="stt-note" class="hint" role="status"></p>
    <div class="row"><span class="name">音声合成</span><span class="keys"><button id="tts-on" type="button">読み上げる</button><button id="tts-off" type="button">読み上げない</button><button id="tts-try" type="button">試す</button></span></div>
    <form class="fields" id="tts" autocomplete="off">
      <label for="tts-baseUrl">サーバ</label><input id="tts-baseUrl" name="baseUrl" placeholder="例: https://api.openai.com/v1">
      <label for="tts-apiKey">API キー</label><input id="tts-apiKey" name="apiKey" type="password" placeholder="なければ空のまま">
      <label for="tts-model">モデル</label><input id="tts-model" name="model" placeholder="gpt-4o-mini-tts">
      <label for="tts-voice">声</label><input id="tts-voice" name="voice" placeholder="alloy">
    </form>
    <p id="tts-note" class="hint" role="status">会話の返事を読み上げます</p>
  </section>
  <section aria-labelledby="h-agent">
    <h3 id="h-agent">AI への指示</h3>
    <div class="row">
      <span class="name">指示と記憶</span>
      <span class="keys"><button id="workspace">フォルダ</button></span>
    </div>
    <p class="hint">見回る先、採用時の動き、話し方、好みは、話しかければ直せます</p>
  </section>
</main>
<svg id="t" viewBox="0 0 15 15" aria-hidden="true"><path class="fill" d="M0 -1H1L15.25 14.25H0Z"/><path class="line" d="M1 0 15.25 14.25H0"/></svg>
</div><script src="hotkey.js"></script><script src="speech.js"></script><script src="settings.js"></script></body></html>
