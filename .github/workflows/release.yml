name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 45
    env:
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: Test
        run: |
          # 公開鍵のないアプリを配ると、その版からは更新を確かめられない
          node -e 'process.exit(require("./app/src-tauri/tauri.conf.json").plugins.updater.pubkey ? 0 : 1)' \
            || { echo "tauri.conf.json に更新の公開鍵がありません。app/setup-updater-key.sh を実行してください"; exit 1; }
          swift test --package-path cli
          node app/qa_graph.mjs
          node app/qa_markdown.mjs
      # 依存のコンパイル結果は cache.yml が main で作る。タグで作っても次のタグから読めないので、ここでは保存しない
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Build, sign and notarize the app
        working-directory: app/src-tauri
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        # 自動更新用の署名付きアーカイブも作る。手元の install.sh は鍵なしで作れるよう、CI でだけ有効にする
        # CLI は npm のビルド済みを使う。cargo install はアプリと別に依存を丸ごとコンパイルし、7 分ほどかかっていた
        run: npx --yes @tauri-apps/cli@2 build --config '{"bundle":{"createUpdaterArtifacts":true}}'
      - name: Notarize and staple the dmg
        run: |
          dmg=$(ls app/src-tauri/target/release/bundle/dmg/*.dmg)
          xcrun notarytool submit "$dmg" --wait \
            --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID"
          xcrun stapler staple "$dmg"
          spctl -a -t open --context context:primary-signature -vv "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: familiar-dmg
          path: app/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
      - name: Describe the update
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          bundle=app/src-tauri/target/release/bundle/macos
          node -e '
            const fs = require("fs");
            const [tag, sig] = process.argv.slice(1);
            fs.writeFileSync(process.env.RUNNER_TEMP + "/latest.json", JSON.stringify({
              version: tag.replace(/^v/, ""),
              pub_date: new Date().toISOString(),
              platforms: { "darwin-aarch64": {
                signature: fs.readFileSync(sig, "utf8"),
                url: `https://github.com/qluto/familiar/releases/download/${tag}/familiar.app.tar.gz`,
              } },
            }, null, 2));
          ' "$GITHUB_REF_NAME" "$bundle/familiar.app.tar.gz.sig"
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            app/src-tauri/target/release/bundle/dmg/*.dmg \
            app/src-tauri/target/release/bundle/macos/familiar.app.tar.gz \
            "$RUNNER_TEMP/latest.json"
