name: cache

# タグのリリースで作ったキャッシュは、ほかのタグから読めない。main で作ったものだけが共有されるので、
# 依存が変わったら main で一度ビルドし、次のリリースが依存のコンパイルを省けるようにする
on:
  push:
    branches: [main]
    paths:
      - app/src-tauri/Cargo.lock
      - app/src-tauri/Cargo.toml
      - .github/workflows/cache.yml
  workflow_dispatch:

jobs:
  rust:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          shared-key: app # release.yml と同じキー
      # リリースと同じ CLI とフラグでコンパイルだけ行う（署名と束ねはしない）
      - working-directory: app/src-tauri
        run: npx --yes @tauri-apps/cli@2 build --no-bundle
